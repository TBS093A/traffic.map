# Premerge: każdy PR i każdy push na gałąź inną niż main.
# Testy jednostkowe, test dymny w przeglądarce, analiza kodu (SAST), zależności (SCA) i sekrety.
name: premerge

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: premerge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Python, workflowy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.14.4
      - run: ruff check .
      - name: Składnia JS (wszystkie moduły sklejone jak w stronie)
        run: |
          python3 -c "import build; print(build.assemble('src/index.html'))" > /tmp/page.html
          python3 - <<'EOF'
          import re
          html = open('/tmp/page.html', encoding='utf-8').read()
          js = re.findall(r'<script>(.*?)</script>', html, re.S)
          open('/tmp/page.js', 'w', encoding='utf-8').write('\n;\n'.join(js))
          EOF
          node --check /tmp/page.js
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  test:
    name: Testy jednostkowe
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]          # najstarsza dostępna na ubuntu-latest i aktualna
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/*.test.mjs

  e2e:
    name: Test w przeglądarce (sieć testowa)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  # CodeQL, dependency review i OSV wysyłają wyniki do code scanningu: na repozytorium prywatnym bez
  # GitHub Advanced Security go nie ma, więc tam te zadania są pomijane (działają po zmianie na publiczne)
  codeql:
    name: SAST (CodeQL)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.184.0
    steps:
      # na repozytorium prywatnym to jedyny SAST (CodeQL wymaga code scanningu)
      - uses: actions/checkout@v7
      - run: semgrep scan --config p/default --config p/javascript --config p/python --config p/github-actions --severity ERROR --error --metrics=off --exclude src/vendor

  dependency-review:
    name: SCA (nowe zależności w PR)
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          allow-licenses: MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, OFL-1.1, CC0-1.0, Python-2.0

  osv:
    name: SCA (OSV-Scanner)
    if: ${{ !github.event.repository.private }}
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0
    with:
      scan-args: |-
        --recursive
        ./

  secrets:
    name: Sekrety (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read          # akcja czyta listę commitów PR-a
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

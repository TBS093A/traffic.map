# Postmerge: po każdym merge do main, który zmienia coś poza screenami i README.
# DAST (OWASP ZAP na uruchomionej stronie) i odświeżenie screenów w README z prawdziwych danych.
#
# paths-ignore przerywa pętlę: merge PR-a ze screenami zmienia tylko docs/screenshots i README.md,
# więc nie uruchamia postmerge ponownie (inaczej każdy merge screenów tworzyłby nowy PR ze screenami,
# bo pogoda, godzina i autobusy zawsze się trochę różnią).
name: postmerge

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/screenshots/**"
      - "README.md"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"          # raz w tygodniu: świeży rozkład i OSM na screenach

permissions:
  contents: read

concurrency:
  group: postmerge
  cancel-in-progress: false

jobs:
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Strona z sieci testowej
        run: python3 tests/e2e/build_fixture.py dist-test
      - name: Serwer (proxy.mjs)
        run: |
          PAGE=dist-test/index.html PORT=8787 nohup node proxy.mjs > proxy.log 2>&1 &
          for _ in $(seq 30); do curl -sf http://localhost:8787/ > /dev/null && break; sleep 1; done
      - uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:8787/
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -j"
          allow_issue_writing: true
          issue_title: "DAST: raport OWASP ZAP"
          artifact_name: zap-report

  screenshots:
    name: Screeny do README
    # drugi bezpiecznik pętli: merge samego PR-a ze screenami nigdy nie generuje nowych
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '/bot/screenshots') }}
    runs-on: ubuntu-24.04          # Playwright nie ma jeszcze Chromium dla ubuntu-latest (26.04)
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Cache danych (GTFS, OSM, adresy)
        uses: actions/cache@v6
        with:
          path: work/cache
          key: rwp-data-${{ github.run_id }}
          restore-keys: rwp-data-
      - name: Pipeline (prawdziwe dane)
        run: python3 pipeline.py --force -v
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fonty z polskimi znakami i emoji
        run: sudo apt-get install -y --no-install-recommends fonts-noto-color-emoji fonts-dejavu-core
      - run: npm run screenshots
      - name: Data screenów w README
        run: |
          d=$(date +%Y-%m-%d)
          python3 - "$d" <<'EOF'
          import re, sys
          p = 'README.md'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'Screeny pokazują rozkład i dane OSM z [^.]*\.', f'Screeny pokazują rozkład i dane OSM z {sys.argv[1]}.', s)
          open(p, 'w', encoding='utf-8').write(s)
          EOF
      - name: PR ze screenami
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/screenshots
          delete-branch: true
          commit-message: "Refresh README screenshots"
          title: "Odświeżone screeny w README"
          body: |
            Screeny wygenerowane automatycznie przez `tests/e2e/screenshots.mjs` z aktualnego rozkładu i danych OSM
            (workflow postmerge, uruchomienie ${{ github.run_id }}).
          labels: docs, bot
          add-paths: |
            docs/screenshots/*.png
            docs/screenshots/README.txt
            README.md
